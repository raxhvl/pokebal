[project]
name = "beetle"
version = "0.1.0"
description = "A/B test BALs."
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "python-snappy>=0.7.3",
    "rlp>=4.1.0",
]

[project.scripts]
beetle = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4",
]
